name = "kinvos-license-server"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Base de données D1 — à créer avec :
#   npx wrangler d1 create kinvos-db
# puis coller l'ID renvoyé ci-dessous à la place de "COLLEZ_ICI_L_ID_RENVOYE".
[[d1_databases]]
binding = "DB"
database_name = "kinvos-db"
database_id = "COLLEZ_ICI_L_ID_RENVOYE"

# Clé secrète d'administration — à définir avec :
#   npx wrangler secret put ADMIN_API_KEY
# (ne pas la mettre en clair ici)
